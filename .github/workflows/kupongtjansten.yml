name: Driftsätt kupongtjänsten

# Driftsätter tjänsten profeterna-kupong (worker/kupong-proxy.mjs, med
# worker/kupong.toml) på Cloudflare – samma som att köra
# "npx wrangler@4.147.0 deploy --config worker/kupong.toml" på en dator där
# wrangler är inloggad. Körs för hand: Actions → Driftsätt kupongtjänsten →
# Run workflow. Kräver hemligheten CLOUDFLARE_API_TOKEN, en nyckel från
# Cloudflare med mallen "Edit Cloudflare Workers" (se README, avsnittet
# Kupongen). Tjänstens egna hemligheter (GITHUB_TOKEN) ligger kvar hos
# Cloudflare och påverkas inte.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Driftsätt
        run: npx --yes wrangler@4.147.0 deploy --config worker/kupong.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
