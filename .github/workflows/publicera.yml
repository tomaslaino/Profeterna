name: Hämta data och publicera

# Bygger den statiska sajten (src/build.js) och publicerar den på GitHub Pages
# (profeterna.se). Samma upplägg som gravergrav.se, med en skillnad: den
# genererade datan committas inte till repot – den laddas upp som
# Pages-artefakt. Annars skulle varje körning lägga nya versioner av
# matchfilerna i git-historiken. Källcachen (data/cache/) sparas mellan
# körningarna med actions/cache, så att en död källa visas med sin senaste
# lyckade data och sitt datum i stället för att försvinna.
#
# Det enda som committas är prognosjournalen (data/journal/),
# kuponghistoriken (data/kupong-historik.json) och tipparhistoriken
# (data/tippar-historik.json): bygget loggar kommande matcher, fryser in
# färdiga kuponger och sparar gängets egna tips omgång för omgång med
# --journal, och det nya committas till main av github-actions[bot].
# Git-historiken visar då offentligt att en prognos fanns före avspark och
# aldrig skrivits om. Commitsen håller också repot aktivt, så att GitHub inte
# stänger av schemat efter 60 dagar.
#
# Schemat: var 30:e minut (minut 7 och 37, utanför den rusning som brukar vara
# vid hel timme). GitHub kan fördröja schemalagda körningar; sidan visar när
# den senast byggdes och varnar om det dröjt ovanligt länge.

on:
  schedule:
    - cron: "7,37 * * * *"
  push:
    branches: [main]
    # Journalens egna commits startar ingen ny körning: push med GITHUB_TOKEN
    # startar aldrig workflows, och det här är en extra spärr mot en loop.
    paths-ignore: ["data/journal/**"]
  workflow_dispatch: {}

# En körning i taget (hela workflowen, båda jobben). En körning som startar
# medan en annan pågår väntar (GitHub behåller bara den senast köade), så att
# två byggen aldrig loggar samtidigt.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # committa prognosjournalen
    steps:
      - name: Checka ut repo
        uses: actions/checkout@v4
        with:
          # Grenens senaste läge, inte commiten som startade körningen: en
          # schemalagd körning kan ha köat medan den förra committade
          # journalen, och utan de raderna skulle den logga om dem.
          ref: main

      - name: Sätt upp Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Installera beroenden
        run: npm ci --no-audit --no-fund

      - name: Återställ källcachen
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: kallcache-${{ github.run_id }}
          restore-keys: kallcache-

      - name: Hämta källor, logga prognoser och bygg sajten
        run: npm run build -- --journal

      - name: Spara källcachen
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: kallcache-${{ github.run_id }}

      # Bara journalfilerna, kuponghistoriken och tipparhistoriken committas,
      # och bara om de ändrats. Misslyckas committen publiceras inte heller
      # sajten – den visade journalen ska alltid finnas i git. Nästa körning
      # loggar då raderna på nytt (och fryser in samma kuponger igen).
      - name: Committa prognosjournalen och kuponghistoriken
        run: |
          git add data/journal
          if [ -f data/kupong-historik.json ]; then git add data/kupong-historik.json; fi
          if [ -f data/tippar-historik.json ]; then git add data/tippar-historik.json; fi
          if git diff --cached --quiet; then
            echo "Inga nya rader i journalen och inget nytt i kupong- eller tipparhistoriken."
            exit 0
          fi
          # Append-only: en borttagen eller ändrad rad stoppar körningen.
          if git diff --cached -U0 -- data/journal | grep -q '^-{'; then
            echo "::error::Journalen får bara växa – en befintlig rad har ändrats eller tagits bort."
            exit 1
          fi
          rows=$(git diff --cached --numstat -- data/journal | awk '{ s += $1 } END { print s + 0 }')
          if [ "$rows" = 0 ]; then what=""; elif [ "$rows" = 1 ]; then what="1 ny rad"; else what="${rows} nya rader"; fi
          also=""
          if ! git diff --cached --quiet -- data/kupong-historik.json; then also="kuponghistoriken"; fi
          if ! git diff --cached --quiet -- data/tippar-historik.json; then also="${also:+${also} och }tipparhistoriken"; fi
          if [ -z "$also" ]; then
            msg="Prognosjournal: ${what}"
          elif [ -n "$what" ]; then
            msg="Prognosjournal: ${what}; ${also} uppdaterad"
          elif [ "$also" = "kuponghistoriken" ]; then
            msg="Kuponghistoriken uppdaterad"
          elif [ "$also" = "tipparhistoriken" ]; then
            msg="Tipparhistoriken uppdaterad"
          else
            msg="Kupong- och tipparhistoriken uppdaterade"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "${msg}"
          # Har main fått en ny commit under körningen (t.ex. ny kod) läggs
          # journalcommiten ovanpå den.
          for attempt in 1 2 3; do
            if git push -q origin HEAD:main; then
              echo "Committade: ${msg}."
              exit 0
            fi
            git pull -q --rebase origin main || { git rebase --abort; exit 1; }
          done
          exit 1

      - name: Ladda upp sajten
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicera på GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
