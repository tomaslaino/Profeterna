  <circle cx="100" cy="100" r="93.5" fill="none" stroke="#fff4d2" stroke-opacity="0.45"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#6f4c1b" stroke-opacity="0.55" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="0 6.91"/>
  <circle cx="100" cy="100" r="61" fill="none" stroke="#6f4c1b" stroke-opacity="0.5" stroke-width="1.5"/>
  <g fill="#573a10" font-family="Georgia, 'Times New Roman', serif" font-weight="700">
    <text font-size="14" letter-spacing="1"><textPath href="#ring" textLength="452" lengthAdjust="spacing">SANNOLIKHET ATT VI BLIR STENRIKA ·</textPath></text>
    <text x="100" y="113" text-anchor="middle" font-size="42">0,4<tspan font-size="24" dx="3">%</tspan></text>
    <text x="100" y="140" text-anchor="middle" font-size="12" letter-spacing="5" fill-opacity="0.75">ΑΘΕ</text>
