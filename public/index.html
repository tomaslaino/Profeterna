<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matchfixarna – en seriös verksamhet</title>
  <meta name="theme-color" content="#0e0d0b">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="divisioner.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="kupong.css">
  <link rel="stylesheet" href="papper.css">
  <link rel="stylesheet" href="samtal.css">
  <link rel="stylesheet" href="rattning.css">
  <link rel="stylesheet" href="tippare.css">
  <link rel="stylesheet" href="kronan.css">
  <link rel="stylesheet" href="utmarkelser.css">
  <link rel="stylesheet" href="kampen.css">
  <link rel="stylesheet" href="betyg.css">
  <link rel="stylesheet" href="historik.css">
  <link rel="stylesheet" href="spoiler.css">
  <link rel="stylesheet" href="sok.css">
  <link rel="stylesheet" href="matchruta.css">
  <link rel="stylesheet" href="matchblad.css">
  <link rel="stylesheet" href="artikel.css">
  <link rel="stylesheet" href="hojdpunkter.css">
  <link rel="stylesheet" href="enhet.css">
  <link rel="stylesheet" href="hem.css">
  <link rel="stylesheet" href="systembild.css">
  <link rel="stylesheet" href="forklaring.css">
  <link rel="stylesheet" href="kallor.css">
  <link rel="stylesheet" href="modell.css">
  <link rel="stylesheet" href="slitage.css">
  <link rel="stylesheet" href="rum.css">
  <link rel="stylesheet" href="rum-tv.css">
  <link rel="stylesheet" href="rum-ute.css">
  <!-- three.js till gänget i rummet (rum-3d.js), hämtas först när rummet visas -->
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#" aria-label="Matchfixarna – till förstasidan">
        <img class="logo" src="logo.svg" alt="" width="36" height="36">
        <span class="brand-txt"><b id="brand-name">Matchfixarna</b></span>
      </a>
      <nav class="tabs" aria-label="Sektioner">
        <div class="tablist" role="tablist">
          <button type="button" role="tab" id="tab-coupon" data-tab="coupon-section"
            aria-controls="coupon-section" aria-selected="false">Kupong</button>
          <button type="button" role="tab" id="tab-battle" data-tab="battle-section"
            aria-controls="battle-section" aria-selected="false">Olympen</button>
          <button type="button" role="tab" id="tab-matches" data-tab="matches-section"
            aria-controls="matches-section" aria-selected="false">Matcher</button>
        </div>
        <a class="tab-link" href="tabeller.html">Tabeller</a>
        <a class="tab-link" href="statistik.html">Statistik</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- förstasidan: oraklet och Ikaros som polaroider (kronan.js, ritas av
         tippare.js) och omgången bredvid (kupong.js, samtal.js) -->
    <section id="home-section" aria-label="Förstasidan">
      <h1 class="hem-vh">Matchfixarna</h1>
      <div class="hem">
        <div class="hem-bild">
          <div id="hem-kronan" class="hem-kronan"></div>
          <p class="hem-motto">Engelsk fotboll, grekisk bokföring.</p>
        </div>
        <div id="home" class="hem-omg"></div>
      </div>
    </section>

    <!-- kupongen: omgångens kupong och samtalet (kupong.js, samtal.js) -->
    <section id="coupon-section" role="tabpanel" aria-labelledby="tab-coupon" hidden>
      <div id="coupon"></div>
    </section>

    <!-- Olympen: gängets inbördes kamp om tipsen, säsongen igenom, och sist de
         färdigspelade kupongerna (kampen.js, historik.js) -->
    <section id="battle-section" role="tabpanel" aria-labelledby="tab-battle" hidden>
      <div id="kampen"></div>
      <!-- omgångens tippare ur gängets egna tips (tippare.js), flyttas upp
           under rubriken av kampen.js -->
      <div id="tippare"></div>
    </section>

    <section id="matches-section" role="tabpanel" aria-labelledby="tab-matches" hidden>
      <div id="match-list-view">
        <h2 class="page-title">Matcher</h2>
        <div class="toolbar">
          <div id="comp-chips" class="chips" role="group" aria-label="Tävling"></div>
        </div>
        <div id="match-list"></div>
      </div>
    </section>

    <!-- Källor: läget, vad som kommer varifrån och ett kort per källa (kallor.js) -->
    <section id="sources-section" aria-label="Källor" hidden>
      <h2 class="page-title">Källor</h2>
      <div id="sources">Laddar …</div>
    </section>

    <!-- Modell: hur prognoserna räknas och hur bra de är, prognosjournalen
         rättad mot facit (#utvardering) och sist det som prövats och
         detaljerna (modell.js) -->
    <section id="model-section" aria-label="Modell" hidden>
      <h2 class="page-title">Modell</h2>
      <div id="model">Laddar …</div>
      <h3 class="eval-title" id="eval-title">I skarpt läge</h3>
      <div id="evaluation">Laddar …</div>
      <div id="model-more"></div>
    </section>
  </main>

  <!-- matchrutan: öppnas ovanpå sidan med #match/<id> (app.js, matchruta.js) -->
  <dialog id="match-modal" class="mr-modal" aria-label="Matchen">
    <div id="match-detail-view"></div>
  </dialog>

  <footer>
    <img class="logo-sm" src="logo.svg" alt="" width="20" height="20">
    <p>Matchfixarna</p>
    <!-- när datan byggdes, och varningar om något är fel (app.js) -->
    <p id="topline" class="topline" hidden></p>
    <nav class="foot-links" aria-label="Mer"><a href="#kallor">Källor</a><a href="#modell">Modell</a><a href="om-oss.html">Om oss</a></nav>
  </footer>

  <script src="spoiler.js"></script>
  <script src="sok.js"></script>
  <script src="skoldar.js"></script>
  <script src="historik.js"></script>
  <script src="matchruta.js"></script>
  <script src="hojdpunkter.js"></script>
  <script src="forklaring.js"></script>
  <script src="kallor.js"></script>
  <script src="modell.js"></script>
  <script src="app.js"></script>
  <script src="kupong.js"></script>
  <script src="systembild.js"></script>
  <script src="papper.js"></script>
  <script src="folket.js"></script>
  <script src="spela.js"></script>
  <script src="samtal.js"></script>
  <script src="rattning.js"></script>
  <script src="tippoang.js"></script>
  <script src="kronan.js"></script>
  <script src="utmarkelser.js"></script>
  <script src="tippare.js"></script>
  <script src="betyg.js"></script>
  <script src="kampen.js"></script>
  <script src="slitage.js"></script>
  <script src="vader.js"></script>
  <script src="rum-ute.js"></script>
  <script src="rum-tv.js"></script>
  <script src="rum.js"></script>
</body>
</html>
