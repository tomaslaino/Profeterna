<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profeterna – matchprognoser för engelsk fotboll</title>
  <meta name="theme-color" content="#0e0d0b">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="divisioner.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="kupong.css">
  <link rel="stylesheet" href="spoiler.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#matcher" aria-label="Profeterna – till matcherna">
        <img class="logo" src="logo.svg" alt="" width="36" height="36">
        <span class="brand-txt"><b id="brand-name">Profeterna</b></span>
      </a>
      <nav class="tabs" aria-label="Sektioner">
        <div class="tablist" role="tablist">
          <button type="button" role="tab" id="tab-matches" data-tab="matches-section"
            aria-controls="matches-section" aria-selected="true">Matcher</button>
          <button type="button" role="tab" id="tab-coupon" data-tab="coupon-section"
            aria-controls="coupon-section" aria-selected="false">Kupong</button>
          <button type="button" role="tab" id="tab-eval" data-tab="eval-section"
            aria-controls="eval-section" aria-selected="false">Utvärdering</button>
        </div>
        <a class="tab-link" href="divisioner.html">Divisioner</a>
        <a class="tab-link" href="om-oss.html">Om oss</a>
      </nav>
    </div>
  </header>

  <main>
    <section id="matches-section" role="tabpanel" aria-labelledby="tab-matches">
      <div id="match-list-view">
        <div class="hero">
          <div class="hero-main">
            <h1 class="hero-title">Profeterna</h1>
            <div class="hero-lede">
              <!-- lagbilden står här på mobilen och till höger på breda skärmar -->
              <figure class="team-photo team-photo-sm">
                <a href="om-oss.html"><img src="profeterna/lag.jpg" alt="Daniel Johansson, Daniel Laino och Daniel Teijder under en grekisk flagga" width="640" height="800"></a>
              </figure>
              <p class="hero-motto">Sannolikheter för varje match.</p>
            </div>
            <div id="topline" class="topline"></div>
          </div>
          <!-- stora lagbilden visas bara på breda skärmar -->
          <div class="hero-aside">
            <figure class="team-photo team-photo-lg">
              <a href="om-oss.html"><img src="profeterna/lag.jpg" alt="Daniel Johansson, Daniel Laino och Daniel Teijder under en grekisk flagga"
                width="640" height="800" loading="lazy"></a>
            </figure>
          </div>
        </div>
        <div id="coupon-hero"></div>
        <div class="toolbar">
          <div class="seg" role="group" aria-label="Visa">
            <button type="button" data-view="upcoming" aria-pressed="true">Kommande</button>
            <button type="button" data-view="played" aria-pressed="false">Spelade</button>
          </div>
          <div id="comp-chips" class="chips" role="group" aria-label="Tävling"></div>
        </div>
        <div id="match-list"></div>
      </div>
      <div id="match-detail-view" hidden></div>
    </section>

    <section id="coupon-section" role="tabpanel" aria-labelledby="tab-coupon" hidden>
      <div id="coupon"></div>
    </section>

    <section id="eval-section" role="tabpanel" aria-labelledby="tab-eval" hidden>
      <h2 class="page-title">Utvärdering</h2>
      <div id="evaluation">Laddar …</div>
    </section>

    <section id="sources-section" aria-label="Källor" hidden>
      <h2 class="page-title">Källor</h2>
      <p class="intro" id="sources-summary"></p>
      <div id="coverage"></div>
      <h3>Källorna</h3>
      <div id="sources-table"></div>
      <p class="legend" id="unmapped"></p>
    </section>

    <section id="model-section" aria-label="Modell" hidden>
      <h2 class="page-title">Modell</h2>
      <div id="model">Laddar …</div>
    </section>
  </main>

  <footer>
    <img class="logo-sm" src="logo.svg" alt="" width="20" height="20">
    <p>Profeterna</p>
    <nav class="foot-links" aria-label="Mer"><a href="#kallor">Källor</a><a href="#modell">Modell</a><a href="historik.html">Kuponghistorik</a></nav>
  </footer>

  <script src="spoiler.js"></script>
  <script src="app.js"></script>
  <script src="kupong.js"></script>
</body>
</html>
