<!doctype html><meta charset="utf-8"><body style="margin:0;background:#222"><canvas id="ut" style="width:900px"></canvas><script type="module">
// Väggen bakom Hasse Backe: samma slitna affär som gänget sitter i (rum.js, rum-inredning.js), furupanelen med
// paketen på en hylla, bardisken med tidningsbunten, kaffebryggaren och kassan, spårat med riktigt ljus
// (mjuka skuggor, ljus som studsar, blanka ytor, skärpedjup) från figurens kamera (public/rum-hasse-scen.js):
// framför honom, där han sitter vid pultens hörn. Skarpt där han sitter. Han själv och pulten framför
// honom syns inte men skuggar och kastar ljus (sidan ritar dem, rum-hasse-3d.js).
// Bilden har måtten i BAK (rum-hasse-scen.js). ?lage=bred|hog &n=antal varv
import { SCEN, BAK, kamera } from '../../rum-hasse-scen.js';
const q = new URLSearchParams(location.search);
const LAGE = q.get('lage') || 'bred';
const SC = BAK[LAGE];
const N = +(q.get('n') || 64);
const W = SC.W, H = SC.H;
const D = SCEN.D, VAGG = SCEN.VAGG, GOLV = -2300;
// kameran i barens mått (x längs benet, z ut ur väggen)
const KAM = kamera();
const VB = SCEN.BAR * Math.PI / 180;
const tillBar = (v) => [Math.cos(VB) * v[0] - Math.sin(VB) * v[2], v[1], Math.sin(VB) * v[0] + Math.cos(VB) * v[2]];
const v3 = (v) => `vec3(${v.map((x) => x.toFixed(5)).join(', ')})`;
const KP = tillBar(KAM.pos), KR = tillBar(KAM.hoger), KU = tillBar(KAM.upp), KB = tillBar(KAM.bak);

// ---------- paket och etiketter ----------
const MARKE = {
  Kings: ['#6e1f1c', '#d8ad3e', '#2a0c0a', 'Kings'], Parti: ['#1e5a3a', '#e9e2cc', '#0d2c1b', 'Parti'], Prins: ['#1d3d78', '#e8e4d4', '#0c1c3c', 'Prins'],
  Gul: ['#e8dfbf', '#1f6a43', '#1f6a43', 'Gul'], North: ['#efe9db', '#a3271f', '#7a1b16', 'North'], Blend: ['#e6dcc0', '#a32a24', '#7a1b16', 'Blend'], Royal: ['#b37a1c', '#3a2410', '#20120a', 'Royal'],
};
const NAMN = Object.keys(MARKE);
const CELL = [128, 204];
const atlas = document.createElement('canvas'); atlas.width = 2048; atlas.height = 1024;
const ax = atlas.getContext('2d');
NAMN.forEach((n, i) => {
  const [a, b, c, t] = MARKE[n];
  const x = i * CELL[0];
  ax.fillStyle = a; ax.fillRect(x, 0, CELL[0], CELL[1]);
  ax.fillStyle = b; ax.fillRect(x, CELL[1] * 0.36, CELL[0], CELL[1] * 0.3);
  ax.fillStyle = c; ax.fillRect(x, CELL[1] * 0.34, CELL[0], 3); ax.fillRect(x, CELL[1] * 0.66, CELL[0], 3);
  ax.fillStyle = a; ax.font = '700 30px Georgia, serif'; ax.textAlign = 'center'; ax.textBaseline = 'middle'; ax.fillText(t, x + CELL[0] / 2, CELL[1] * 0.52);
  ax.fillStyle = b; ax.beginPath(); ax.arc(x + CELL[0] / 2, CELL[1] * 0.18, 15, 0, 7); ax.fill();
  ax.fillStyle = c; ax.font = '600 10px Georgia, serif'; ax.fillStyle = b; ax.fillText('20 st', x + CELL[0] / 2, CELL[1] * 0.84);
});
// ett gammalt lagfoto i ram
{
  const x = 7 * CELL[0];
  ax.fillStyle = '#c0ae8c'; ax.fillRect(x, 0, CELL[0], CELL[1]);
  ax.fillStyle = '#a89870'; ax.fillRect(x, CELL[1] * 0.62, CELL[0], CELL[1] * 0.38);
  ax.fillStyle = '#efe6d2'; ax.fillRect(x, 0, CELL[0], 9); ax.fillRect(x, CELL[1] - 22, CELL[0], 22); ax.fillRect(x, 0, 9, CELL[1]); ax.fillRect(x + CELL[0] - 9, 0, 9, CELL[1]);
  for (let r = 0; r < 2; r++) for (let k = 0; k < 6 - r; k++) { const px = x + 12 + (k + r / 2) * 19; const py = CELL[1] * (0.48 + r * 0.17); ax.fillStyle = '#3a3026'; ax.fillRect(px, py, 14, 26); ax.fillStyle = '#d8c4a4'; ax.beginPath(); ax.arc(px + 7, py - 6, 6, 0, 7); ax.fill(); }
}

// skyltar, lappar och annat som hänger i rummet: [u0, v0, u1, v1] i atlasen
const region = (x, y, w, h, rita) => { ax.save(); ax.beginPath(); ax.rect(x, y, w, h); ax.clip(); ax.translate(x, y); rita(ax, w, h); ax.restore(); return [x / atlas.width, y / atlas.height, (x + w) / atlas.width, (y + h) / atlas.height]; };
const KREDIT = region(0, 210, 620, 230, (a, w, h) => {
  a.fillStyle = '#e2d6b4'; a.fillRect(0, 0, w, h);
  a.strokeStyle = '#7a1b16'; a.lineWidth = 9; a.strokeRect(16, 16, w - 32, h - 32);
  a.fillStyle = '#7a1b16'; a.textAlign = 'center'; a.textBaseline = 'middle';
  a.font = '700 92px Georgia, serif'; a.fillText('KREDIT', w / 2, h * 0.34);
  a.font = '700 70px Georgia, serif'; a.fillText('GES EJ', w / 2, h * 0.7);
  a.fillStyle = 'rgba(70,45,10,.22)'; for (let i = 0; i < 26; i++) { const x = (i * 197) % w, y = (i * 83) % h; a.fillRect(x, y, 3 + (i % 5) * 7, 2); }
});
const KALENDER = region(630, 210, 340, 480, (a, w, h) => {
  a.fillStyle = '#e8e0cc'; a.fillRect(0, 0, w, h);
  a.fillStyle = '#7d2f22'; a.fillRect(0, 0, w, 70);
  a.fillStyle = '#efe6d2'; a.font = '700 40px Georgia, serif'; a.textAlign = 'center'; a.textBaseline = 'middle'; a.fillText('NOVEMBER', w / 2, 36);
  a.font = '600 30px Georgia, serif';
  for (let r = 0; r < 5; r++) for (let k = 0; k < 7; k++) { const n = r * 7 + k + 1; if (n > 30) continue; a.fillStyle = k === 6 ? '#a3271f' : '#2a241c'; a.fillText(String(n), 28 + k * 47, 112 + r * 58); }
  a.strokeStyle = '#c23a2a'; a.lineWidth = 4; a.beginPath(); a.arc(28 + 5 * 47, 112 + 58, 22, 0, 7); a.stroke();
  a.fillStyle = 'rgba(70,45,10,.5)'; a.fillRect(0, h - 58, w, 58);
});
const lapp = (x, y, f = '#efe8d6') => region(x, y, 230, 310, (a, w, h) => {
  a.fillStyle = f; a.fillRect(0, 0, w, h);
  a.fillStyle = '#c0553a'; a.fillRect(0, 0, w, 26);
  a.strokeStyle = '#27324a'; a.lineWidth = 3;
  for (let i = 0; i < 11; i++) { a.beginPath(); a.moveTo(16, 50 + i * 22); let px = 16; for (let k = 0; k < 7; k++) { px += 8 + ((x + i * 7 + k * 13) % 26); a.lineTo(px, 50 + i * 22 + ((k * 7 + i) % 5) - 2); } a.stroke(); }
});
const LAPP = lapp(980, 210);
const KASSA = region(0, 450, 440, 300, (a, w, h) => {
  a.fillStyle = '#a7a08c'; a.fillRect(0, 0, w, h);
  for (let r = 0; r < 5; r++) for (let k = 0; k < 7; k++) { a.fillStyle = k > 4 ? (r % 2 ? '#7d2f22' : '#3a3a34') : '#e0d8c2'; a.fillRect(20 + k * 58, 24 + r * 54, 44, 42); }
});
const PRIS = region(0, 760, 1024, 34, (a, w, h) => {
  a.fillStyle = '#b5ab90'; a.fillRect(0, 0, w, h);
  a.fillStyle = '#26221c'; a.font = '600 20px Georgia, serif'; a.textBaseline = 'middle';
  for (let i = 0; i < 16; i++) { a.fillStyle = '#26221c'; a.fillText(`${17 + (i * 5) % 9}:50`, 6 + i * 64, h / 2); a.fillStyle = '#8a8270'; a.fillRect(60 + i * 64, 2, 2, h - 4); }
});
const TIDNING = region(1560, 530, 300, 300, (a, w, h) => {
  a.fillStyle = '#d6cfba'; a.fillRect(0, 0, w, h);
  a.fillStyle = '#a3271f'; a.fillRect(14, 12, w - 28, 44);
  a.fillStyle = '#efe6d2'; a.font = '700 30px Georgia, serif'; a.textAlign = 'center'; a.textBaseline = 'middle'; a.fillText('EXTRA', w / 2, 35);
  a.fillStyle = '#1e1a15'; a.fillRect(14, 68, w - 28, 26); a.fillRect(14, 102, w - 90, 26);
  a.fillStyle = '#6a6455'; a.fillRect(14, 140, 150, 110);
  a.fillStyle = 'rgba(30,26,21,.55)'; for (let i = 0; i < 8; i++) a.fillRect(176, 142 + i * 14, w - 192, 5);
});

// ---------- scenen ----------
const P = [];
let slump = 4711; const rnd = () => (slump = (slump * 16807) % 2147483647) / 2147483647;
const RGB = (h) => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255].map((v) => v ** 2.2);
// typ: 0 låda, 1 stående cylinder, 2 ellipsoid, 3 liggande cylinder (x). mat: 0 färg, 1 furu, 3 etikett, 4 glas, 5 mässing, 6 lyser, 7 osynlig för kameran, 8 bardiskens front, 10 pulten, 11 bardiskens skiva, 12 aluminium, 13 krom, 15 papper, 16 vinyl, 17 tidning
const box = (c, h, mat, col = [1, 1, 1], uv = [0, 0, 0, 0]) => P.push({ t: 0, c, h, mat, col, uv });
const cyl = (c, r, hh, mat, col = [1, 1, 1]) => P.push({ t: 1, c, h: [r, hh, r], mat, col, uv: [0, 0, 0, 0] });
const ell = (c, h, mat, col = [1, 1, 1]) => P.push({ t: 2, c, h, mat, col, uv: [0, 0, 0, 0] });
const xcyl = (c, r, hx, mat, col = [1, 1, 1]) => P.push({ t: 3, c, h: [hx, r, r], mat, col, uv: [0, 0, 0, 0] });
const G = [];
const grupp = (fn) => {
  const a = P.length; fn(); const b = P.length;
  const mn = [1e9, 1e9, 1e9], mx = [-1e9, -1e9, -1e9];
  for (let i = a; i < b; i++) for (let k = 0; k < 3; k++) { mn[k] = Math.min(mn[k], P[i].c[k] - P[i].h[k]); mx[k] = Math.max(mx[k], P[i].c[k] + P[i].h[k]); }
  G.push({ mn: mn.map((v) => v - 1), mx: mx.map((v) => v + 1), a, b });
};
// väggen, golvet, taket och rummet runt om
grupp(() => {
  box([0, 0, VAGG - 20], [9000, 4000, 20], 1);
  box([0, GOLV - 20, 2000], [9000, 20, 3200], 0, RGB('#2a1c12'));
  box([0, 1900, 2000], [9000, 20, 3200], 0, RGB('#4a3a2a'));
  box([-8000, 0, 2000], [20, 4000, 3000], 0, RGB('#3a2a1c'));
  box([8000, 0, 2000], [20, 4000, 3000], 0, RGB('#3a2a1c'));
  box([0, 0, 5200], [9000, 4000, 20], 0, RGB('#2a2018'));
});
const T = -300; // bakdiskens ovansida, så som bardisken i rummet: skiva, fronten med fyllningar i ramar, mässingskrokar
const TJ = 70, DJ = 560, FR = 340;
const hylla = (y, x0, x1, ram = 8) => {
  box([(x0 + x1) / 2, y - 12, VAGG + 110], [(x1 - x0) / 2, 12, 110], ram);
  box([(x0 + x1) / 2, y - 22, VAGG + 222], [(x1 - x0) / 2, 22, 3], 3, [1, 1, 1], PRIS);
  let x = x0 + 40;
  while (x < x1 - 60) {
    if (rnd() < 0.09) { x += 40 + rnd() * 70; continue; }
    const n = 2 + Math.floor(rnd() * 5);
    const m = NAMN[Math.floor(rnd() * NAMN.length)];
    const i = NAMN.indexOf(m);
    for (let k = 0; k < n && x < x1 - 60; k++) {
      const fram = 150 + rnd() * 26, hh = 79;
      box([x, y + hh, VAGG + fram / 2], [47, hh, fram / 2], 3, RGB(MARKE[m][0]), [i * CELL[0] / atlas.width, 0, (i + 1) * CELL[0] / atlas.width, CELL[1] / atlas.height]);
      x += 99;
    }
    x += 2 + rnd() * 3;
  }
};
// en lapp, skylt eller tavla på väggen
const papper = (x, y, hx, hy, uv, z = VAGG + 4, mat = 15) => box([x, y, z], [hx, hy, 1.5], mat, [1, 1, 1], uv);

// bardisken
grupp(() => {
  box([0, T - TJ / 2, VAGG + DJ / 2], [7000, TJ / 2, DJ / 2], 11);
  box([0, (T - TJ + GOLV) / 2, VAGG + FR / 2], [7000, (T - TJ - GOLV) / 2, FR / 2], 8);
});
grupp(() => {
  const z = VAGG + FR + 8, y0 = T - TJ;
  box([0, y0 - 80, z], [7000, 80, 8], 8);
  box([0, y0 - 1300, z], [7000, 80, 8], 8);
  for (let x = -4200; x < 4000; x += 900) box([x, y0 - 700, z], [55, 680, 8], 8);
});
grupp(() => {
  const z = VAGG + FR + 18, y = T - TJ - 215;
  for (let x = -3750; x < 3400; x += 900) {
    box([x, y, z], [13, 34, 3], 0, RGB('#b08c48'));
    box([x, y - 16, z + 30], [5, 5, 30], 0, RGB('#b08c48'));
    ell([x, y - 2, z + 58], [6, 17, 6], 0, RGB('#b08c48'));
  }
});
// konsolerna i järn under skivan
grupp(() => {
  for (let x = -3300; x < 3400; x += 1800) box([x, T - TJ - 60, VAGG + FR + 90], [9, 50, 80], 0, RGB('#1d1611'));
});
// en barstol som gängets, längst till höger
const stol = (x, z) => {
  const Y = -1050;
  cyl([x, Y, z], 262, 44, 16, RGB('#6e2320'));
  ell([x, Y + 44, z], [262, 34, 262], 16, RGB('#6e2320'));
  cyl([x, Y - 56, z], 175, 12, 13, [0.72, 0.72, 0.7]);
  for (const [a, b] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) cyl([x + a * 130, Y - 620, z + b * 130], 18, 560, 13, [0.72, 0.72, 0.7]);
};
grupp(() => { stol(2240, VAGG + 700); });

// flaskor som gängets, i verklig storlek
const flaska = (x, z, col, h = 1, etikett = '#e6dcc0') => {
  cyl([x, T + 120 * h, z], 50, 120 * h, 4, col);
  ell([x, T + 240 * h, z], [50, 44, 50], 4, col);
  cyl([x, T + 310 * h, z], 17, 58 * h, 4, col);
  cyl([x, T + 372 * h, z], 19, 8, 13, [0.7, 0.68, 0.6]);
  cyl([x, T + 118 * h, z], 51, 52 * h, 0, RGB(etikett));
};
// tre flaskor mellan matchlistan och hans axel (bakom listan ska det vara lugnt)
grupp(() => {
  const Z = VAGG + 300;
  [[-1010, 0], [-900, 60], [-780, -10]].forEach(([x, dz]) => flaska(x, Z + dz, RGB('#2c4a2c'), 1));
});
// tidningsbunten: returerna, med snöre
grupp(() => {
  const x = 1120, z = VAGG + 320;
  const ton = ['#a79f88', '#8f8873', '#b0a890', '#98907a', '#a79f88', '#8f8873', '#b5ad96'];
  ton.forEach((c, i) => {
    const o = [[0, 0], [9, -6], [-7, 5], [11, 3], [-4, -7], [6, 6], [-3, 0]][i];
    const y = T + 15 + i * 30;
    box([x + o[0], y, z + o[1]], [262, 15, 188], i === ton.length - 1 ? 17 : 0, RGB(c), TIDNING);
  });
  const hojd = 7 * 15 + 2;
  box([x, T + hojd, z], [5, hojd + 1, 195], 0, RGB('#5c4e34'));
  box([x, T + hojd, z], [268, hojd + 1, 5], 0, RGB('#5c4e34'));
});
// kaffebryggaren: påtår ×4
grupp(() => {
  const x = 1640, z = VAGG + 290;
  box([x, T + 22, z], [150, 22, 135], 0, RGB('#2c2a25'));
  box([x, T + 270, z - 92], [130, 270, 40], 0, RGB('#2c2a25'));
  cyl([x, T + 520, z - 10], 142, 52, 0, RGB('#2c2a25'));
  cyl([x, T + 150, z + 25], 104, 104, 4, [0.5, 0.5, 0.48]);
  cyl([x, T + 92, z + 25], 100, 46, 0, RGB('#1a0d06'));
  box([x, T + 262, z + 25], [108, 8, 108], 0, RGB('#2c2a25'));
  box([x + 118, T + 150, z + 25], [12, 58, 14], 0, RGB('#2c2a25'));
  box([x + 90, T + 22, z + 136], [12, 7, 2], 6, [2.2, 0.2, 0.12]);
});
// kassaapparaten
grupp(() => {
  const x = 2130, z = VAGG + 300;
  box([x, T + 85, z], [300, 85, 230], 0, RGB('#7c7562'));
  box([x, T + 255, z - 60], [285, 90, 160], 0, RGB('#857e6a'));
  box([x, T + 262, z + 102], [280, 80, 3], 3, [1, 1, 1], KASSA);
  box([x + 40, T + 405, z - 120], [190, 62, 60], 0, RGB('#2e2e2a'));
  box([x + 40, T + 408, z - 58], [158, 36, 2], 6, [0.025, 0.13, 0.055]);
});

// Paketen på en hylla över hans huvud (hjässan står ungefär vid y = 600, och bilden slutar strax över 800).
grupp(() => hylla(640, -3800, 2900));
// lagfotot, och furan runt det som inte har mörknat lika mycket där en större tavla har hängt (furu)
grupp(() => {
  box([-640, 330, VAGG + 8], [122, 168, 8], 8);
  box([-640, 330, VAGG + 17], [104, 150, 1], 3, [1, 1, 1], [7 * CELL[0] / atlas.width, 0, 8 * CELL[0] / atlas.width, CELL[1] / atlas.height]);
});
// det som sitter på panelen: skylten (notan på pulten säger annat), kalendern och en lapp
grupp(() => {
  papper(1040, 330, 250, 92, KREDIT);
  papper(1540, 410, 150, 212, KALENDER);
  papper(1940, 440, 90, 124, LAPP);
});
// han själv och pulten framför honom: syns inte, men skuggar och kastar ljus
const HAN = G.length;
const hanEll = (c, h, col) => ell(tillBar(c), h, 7, col);
grupp(() => {
  hanEll([10, -60, 40], [300, 520, 150], RGB('#26262a'));
  hanEll([-5, 515, 80], [150, 195, 150], RGB('#c89878'));
  hanEll([0, 160, 170], [78, 200, 30], RGB('#dcdce4'));
  hanEll([-330, -180, 90], [95, 300, 100], RGB('#26262a'));
  hanEll([420, -240, 180], [85, 300, 120], RGB('#26262a'));
});
const DISK = G.length;
// (pulten vid hörnet: benet framför honom och armen som går fram mot en, förbi kameran)
grupp(() => {
  const { Y, Z, DJUP } = SCEN.DISK;
  // (pultens mått → barens: han sitter vid PLATS)
  const xi = SCEN.HORN.X - SCEN.PLATS, xo = xi + SCEN.HORN.B, zl = 4400;
  box([(xo - 7000) / 2, Y - 20, Z + DJUP / 2], [(xo + 7000) / 2, 20, DJUP / 2], 10);
  box([(xo - 7000) / 2, (Y - 40 + GOLV) / 2, Z + DJUP / 2 + 60], [(xo + 7000) / 2, (Y - 40 - GOLV) / 2, DJUP / 2 - 60], 8);
  box([(xi + xo) / 2, Y - 20, (Z + DJUP + zl) / 2], [(xo - xi) / 2, 20, (zl - Z - DJUP) / 2], 10);
  box([(xi + xo) / 2 + 30, (Y - 40 + GOLV) / 2, (Z + DJUP + zl) / 2], [(xo - xi) / 2 - 60, (Y - 40 - GOLV) / 2, (zl - Z - DJUP) / 2], 8);
});
// ?dag=1: bara dagsljuset genom affärens stora fönster till höger, vitt, som ett eget lager. Sidan lägger
// det ovanpå väggen i himlens färg och så starkt som det är ljust ute (dagsljus i rum-hasse.js), så att
// väggen får samma fönsterljus som han (DAGSLJUS i rum-hasse-arm.js).
const LJ = q.get('dag') ? [
  { p: [4700, 760, 3100], r: 1050, e: [1, 1, 1].map((v) => v * +(q.get('ds') || 30)) },
] : [
  // svagt från gatan och lamporna i affären (nyckeln i figurens riktning, rum-hasse-arm.js)
  { p: [-700, 1450, 2100], r: 460, e: [1.0, 0.9, 0.76].map((v) => v * 4.5) },
  // neonskylten i affärens fönster till höger: rött
  { p: [2600, 650, 1500], r: 260, e: [1.0, 0.16, 0.1].map((v) => v * 9) },
  // gatan genom fönstret till höger: kallt
  { p: [3800, 1300, 3400], r: 620, e: [0.55, 0.68, 1.0].map((v) => v * 3.6) },
  // ?lys=1: lysröret i affärens tak är tänt, som i rummet från sex på morgonen till midnatt (rum-folk.js):
  // röret framför baren och affären i dess sken till höger. Sidan byter mellan den här bilden och
  // nattens efter klockan, och lägger fönsterljuset (?dag=1) ovanpå på dagen (vagg i rum-hasse.js).
  ...(q.get('lys') ? [
    { p: [-700, 1820, 2300], r: 210, e: [0.96, 0.98, 1.0].map((v) => v * +(q.get('ls') || 100)) },
    { p: [1500, 1820, 2300], r: 210, e: [0.96, 0.98, 1.0].map((v) => v * +(q.get('ls') || 100)) },
    { p: [5600, 1000, 3200], r: 1300, e: [0.95, 0.92, 0.86].map((v) => v * +(q.get('as') || 18)) },
  ] : []),
];
console.log('primitiver', P.length, 'grupper', G.length);

// ---------- webgl ----------
const c = document.getElementById('ut'); c.width = W; c.height = H;
const gl = c.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false });
gl.getExtension('EXT_color_buffer_float');
const DW = 4;
