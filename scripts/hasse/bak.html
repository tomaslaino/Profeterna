{

// typ: 0 låda, 1 stående cylinder, 2 ellipsoid, 3 liggande cylinder (x). mat: 0 färg, 1 furu, 2 mahogny blank, 3 etikett, 4 glas, 5 mässing, 6 lyser, 7 osynlig för kameran, 8 mörkt trä, 9 blank färg

const VS = `#version 300 es
in vec2 a; void main(){ gl_Position = vec4(a, 0., 1.); }`;
const FS = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
uniform sampler2D uP, uA, uPrev; uniform int uF; uniform vec4 uG0[${G.length}], uG1[${G.length}]; uniform ivec2 uGi[${G.length}];

out vec4 ut;
const float PI = 3.14159265;
uint st;
float rn() { st = st * 747796405u + 2891336453u; uint w = ((st >> ((st >> 28u) + 4u)) ^ st) * 277803737u; return float((w >> 22u) ^ w) / 4294967296.; }
struct Hit { float t; int id; vec3 n; };
vec4 data(int i, int k) { return texelFetch(uP, ivec2(k, i), 0); }
bool slab(vec3 ro, vec3 ird, vec3 mn, vec3 mx, float tmax) { vec3 a = (mn - ro) * ird, b = (mx - ro) * ird; vec3 t0 = min(a, b), t1 = max(a, b); float n = max(max(t0.x, t0.y), t0.z), f = min(min(t1.x, t1.y), t1.z); return f >= max(n, 0.) && n < tmax; }
void prova(int i, vec3 ro, vec3 rd, vec3 ird, inout Hit h) {

  if (t == 0) {
    vec3 a = (-s - o) * ird, b = (s - o) * ird; vec3 t0 = min(a, b), t1 = max(a, b);
    float n = max(max(t0.x, t0.y), t0.z), f = min(min(t1.x, t1.y), t1.z);
    if (f >= max(n, 0.)) { float tt = n > 1e-3 ? n : f; if (tt > 1e-3 && tt < h.t) { h.t = tt; h.id = i; vec3 nn = -sign(rd) * step(t0.yzx, t0.xyz) * step(t0.zxy, t0.xyz); if (n <= 1e-3) nn = sign(rd) * step(t1.xyz, t1.yzx) * step(t1.xyz, t1.zxy); h.n = nn; } }
  } else if (t == 1) {
    float a = dot(rd.xz, rd.xz), b = dot(o.xz, rd.xz), cc = dot(o.xz, o.xz) - s.x * s.x, dd = b * b - a * cc;
    if (dd > 0.) { float sq = sqrt(dd); for (int k = 0; k < 2; k++) { float tt = (-b + (k == 0 ? -sq : sq)) / a; float y = o.y + rd.y * tt; if (tt > 1e-3 && tt < h.t && abs(y) < s.y) { h.t = tt; h.id = i; h.n = vec3(o.x + rd.x * tt, 0., o.z + rd.z * tt) / s.x; break; } } }
    float ty = (-sign(rd.y) * s.y - o.y) * ird.y; if (ty > 1e-3 && ty < h.t) { vec2 pq = o.xz + rd.xz * ty; if (dot(pq, pq) < s.x * s.x) { h.t = ty; h.id = i; h.n = vec3(0., -sign(rd.y), 0.); } }
  } else if (t == 2) {

  } else {

float h1(float x) { return fract(sin(x * 91.17) * 43758.5453); }
