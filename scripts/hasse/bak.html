<!doctype html><meta charset="utf-8"><body style="margin:0;background:#222"><canvas id="ut" style="width:900px"></canvas><script type="module">
// Väggen bakom Hasse Backe: samma slitna affär som gänget sitter i (rum.js, rum-inredning.js), med ett stort
// glasparti ut mot S:t Eriksbron ovanför bardisken (flaskorna och en barstol), spårat med riktigt ljus
// (mjuka skuggor, ljus som studsar, blanka ytor, skärpedjup) från figurens kamera (public/rum-hasse-scen.js):
// framför honom, där han sitter vid pultens hörn. Skarpt där han sitter. Han själv och pulten framför
// honom syns inte men skuggar och kastar ljus (sidan ritar dem, rum-hasse-3d.js).
// Där kameran ser ut genom glaset (SCEN.FONSTER) är bilden genomskinlig, och sidan lägger utsikten bakom
// (rum-hasse-ute.js). Ljuset utifrån kommer in genom fönstren (HIMMEL nedan).
// Bilden har måtten i BAK (rum-hasse-scen.js). ?lage=bred|hog &n=antal varv
import { SCEN, BAK, kamera } from '../../rum-hasse-scen.js';
const q = new URLSearchParams(location.search);
const LAGE = q.get('lage') || 'bred';
const SC = BAK[LAGE];
const N = +(q.get('n') || 64);
const W = SC.W, H = SC.H;
const D = SCEN.D, VAGG = SCEN.VAGG, GOLV = -2300;
// (lamporna i affären står lika långt från väggen som när den stod vid −1100, så att väggen får samma ljus
// som förut, rummets furu; väggen flyttades bakåt 2026-11-11 så att det går att komma förbi bakom honom)
const DZ = VAGG + 1100;
// kameran i barens mått (x längs benet, z ut ur väggen)
const KAM = kamera();
const VB = SCEN.BAR * Math.PI / 180;
const tillBar = (v) => [Math.cos(VB) * v[0] - Math.sin(VB) * v[2], v[1], Math.sin(VB) * v[0] + Math.cos(VB) * v[2]];
const v3 = (v) => `vec3(${v.map((x) => x.toFixed(5)).join(', ')})`;
const KP = tillBar(KAM.pos), KR = tillBar(KAM.hoger), KU = tillBar(KAM.upp), KB = tillBar(KAM.bak);

// (atlasen för etiketter och papper: sedan fönstren kom finns inga paket, skyltar eller tidningar på väggen)

// ---------- scenen ----------
const P = [];
let slump = 4711; const rnd = () => (slump = (slump * 16807) % 2147483647) / 2147483647;

// typ: 0 låda, 1 stående cylinder, 2 ellipsoid, 3 liggande cylinder (x). mat: 0 färg, 1 furu, 3 etikett, 4 glas, 5 mässing, 6 lyser, 7 osynlig för kameran, 8 bardiskens front, 10 pulten, 11 bardiskens skiva, 12 aluminium, 13 krom, 15 papper, 16 vinyl, 17 tidning, 18 golvet

const G = [];

  const a = P.length; fn(); const b = P.length;

  for (let x = -3300; x < 3400; x += 1800) box([x, T - TJ - 60, VAGG + FR + 90], [9, 50, 80], 0, RGB('#1d1611'));

grupp(() => { stol(2760, VAGG + 700); });

// flaskor som gängets, i verklig storlek

// han själv och pulten framför honom: syns inte, men skuggar och kastar ljus
const HAN = G.length;
const hanEll = (c, h, col) => ell(tillBar(c), h, 7, col);
grupp(() => {

const DISK = G.length;
// (pulten vid hörnet: benet framför honom och armen som går fram mot en, förbi kameran)
grupp(() => {
  const { Y, Z, DJUP } = SCEN.DISK;
  // (pultens mått → barens: han sitter vid PLATS)
  const xi = SCEN.HORN.X - SCEN.PLATS, xo = xi + SCEN.HORN.B, zl = 4400;
  box([(xo - 7000) / 2, Y - 20, Z + DJUP / 2], [(xo + 7000) / 2, 20, DJUP / 2], 10);
  box([(xo - 7000) / 2, (Y - 40 + GOLV) / 2, Z + DJUP / 2 + 60], [(xo + 7000) / 2, (Y - 40 - GOLV) / 2, DJUP / 2 - 60], 8);
  box([(xi + xo) / 2, Y - 20, (Z + DJUP + zl) / 2], [(xo - xi) / 2, 20, (zl - Z - DJUP) / 2], 10);
  box([(xi + xo) / 2 + 30, (Y - 40 + GOLV) / 2, (Z + DJUP + zl) / 2], [(xo - xi) / 2 - 60, (Y - 40 - GOLV) / 2, (zl - Z - DJUP) / 2], 8);
});
// ?dag=1: bara dagsljuset genom affärens stora fönster till höger, vitt, som ett eget lager. Sidan lägger

  { p: [4700, 760, 3100 + DZ], r: 1050, e: [1, 1, 1].map((v) => v * +(q.get('ds') || 30)) },
] : [

  { p: [-700, 1450, 2100 + DZ], r: 460, e: [1.0, 0.9, 0.76].map((v) => v * 4.5 * +(q.get('ks') || 1)) },
  // neonskylten i affärens fönster till höger: rött
  { p: [2600, 650, 1500 + DZ], r: 260, e: [1.0, 0.16, 0.1].map((v) => v * 9) },
  // gatan genom fönstret till höger: kallt
  { p: [3800, 1300, 3400 + DZ], r: 620, e: [0.55, 0.68, 1.0].map((v) => v * 3.6) },
  // ?lys=1: lysröret i affärens tak är tänt, som i rummet från sex på morgonen till midnatt (rum-folk.js):

  ...(q.get('lys') ? [
    { p: [-700, 1820, 2300 + DZ], r: 210, e: [0.96, 0.98, 1.0].map((v) => v * +(q.get('ls') || 100)) },
    { p: [1500, 1820, 2300 + DZ], r: 210, e: [0.96, 0.98, 1.0].map((v) => v * +(q.get('ls') || 100)) },
    { p: [5600, 1000, 3200 + DZ], r: 1300, e: [0.95, 0.92, 0.86].map((v) => v * +(q.get('as') || 18)) },
  ] : []),

// Det som kommer in genom fönstren: en stråle som går ut genom dem (bort från en, −z) hämtar det här. På
// dagen (?dag=1) himlens ljus, vitt som fönsterljuset till höger (sidan färgar det); annars stadens och
// brons lampor, svagt och kallt.
const HIMMEL = q.get('dag') ? [1, 1, 1].map((v) => v * +(q.get('hs') || 1.6)) : [0.05, 0.06, 0.085].map((v) => v * +(q.get('hn') || 1));
// exponeringen före kurvan (FS2): så att furun och mahognyn är lika ljusa som i rummet (förut 0,7, ändrat 2026-11-13)
const EXP = +(q.get('exp') || 1);
console.log('primitiver', P.length, 'grupper', G.length);

// ---------- webgl ----------
const c = document.getElementById('ut'); c.width = W; c.height = H;
const gl = c.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false });
gl.getExtension('EXT_color_buffer_float');
const DW = 4;
const data = new Float32Array(DW * 4 * P.length);
P.forEach((p, i) => { data.set([p.c[0], p.c[1], p.c[2], p.t, p.h[0], p.h[1], p.h[2], p.mat, p.col[0], p.col[1], p.col[2], 0, p.uv[0], p.uv[1], p.uv[2], p.uv[3]], i * DW * 4); });
const tex = (w, h, ifmt, fmt, typ, d, filt = gl.NEAREST) => { const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t); gl.texImage2D(gl.TEXTURE_2D, 0, ifmt, w, h, 0, fmt, typ, d); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filt); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filt); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return t; };
const tP = tex(DW, P.length, gl.RGBA32F, gl.RGBA, gl.FLOAT, data);
const tA = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tA); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false); gl.texImage2D(gl.TEXTURE_2D, 0, gl.SRGB8_ALPHA8, gl.RGBA, gl.UNSIGNED_BYTE, atlas); gl.generateMipmap(gl.TEXTURE_2D); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
const VS = `#version 300 es
in vec2 a; void main(){ gl_Position = vec4(a, 0., 1.); }`;
const FS = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;

const vec3 HIMMEL = ${v3(HIMMEL)};
// fönstrens hål (x0, x1, y0, y1) i väggens yttre plan: ljuset utifrån räknas som från en lampa (nedan)
const int NF = ${FO.X.length};
const vec4 FON[NF] = vec4[NF](${FO.X.map(([a, b]) => `vec4(${a.toFixed(1)}, ${b.toFixed(1)}, ${FO.Y0.toFixed(1)}, ${FO.Y1.toFixed(1)})`).join(', ')});

const float PI = 3.14159265;
uint st;
float rn() { st = st * 747796405u + 2891336453u; uint w = ((st >> ((st >> 28u) + 4u)) ^ st) * 277803737u; return float((w >> 22u) ^ w) / 4294967296.; }

bool slab(vec3 ro, vec3 ird, vec3 mn, vec3 mx, float tmax) { vec3 a = (mn - ro) * ird, b = (mx - ro) * ird; vec3 t0 = min(a, b), t1 = max(a, b); float n = max(max(t0.x, t0.y), t0.z), f = min(min(t1.x, t1.y), t1.z); return f >= max(n, 0.) && n < tmax; }
void prova(int i, vec3 ro, vec3 rd, vec3 ird, inout Hit h) {

    float n = max(max(t0.x, t0.y), t0.z), f = min(min(t1.x, t1.y), t1.z);

  } else if (t == 1) {

    if (dd > 0.) { float sq = sqrt(dd); for (int k = 0; k < 2; k++) { float tt = (-b + (k == 0 ? -sq : sq)) / a; float y = o.y + rd.y * tt; if (tt > 1e-3 && tt < h.t && abs(y) < s.y) { h.t = tt; h.id = i; h.n = vec3(o.x + rd.x * tt, 0., o.z + rd.z * tt) / s.x; break; } } }

  } else if (t == 2) {

    if (dd > 0.) { float sq = sqrt(dd); float tt = (-b - sq) / a; if (tt < 1e-3) tt = (-b + sq) / a; if (tt > 1e-3 && tt < h.t) { h.t = tt; h.id = i; h.n = normalize((o + rd * tt) / (s * s)); } }

}

float h1(float x) { return fract(sin(x * 91.17) * 43758.5453); }

// Furupanelen som i rummet (furu i rum.js): breda bräder med mörka fogar, kvistar och ådring, mörkare av
// röken upptill och med fläckar.
