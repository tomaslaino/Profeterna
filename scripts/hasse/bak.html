// ---------- benen och barstolen ----------
float kona(vec3 p, vec3 a, vec3 b, float r1, float r2) {
  vec3 ba = b - a; float l2 = dot(ba, ba), rr = r1 - r2, a2 = l2 - rr * rr, il2 = 1. / l2;
  vec3 pa = p - a; float y = dot(pa, ba), z = y - l2; vec3 q = pa * l2 - ba * y; float x2 = dot(q, q);
  float y2 = y * y * l2, z2 = z * z * l2, k = sign(rr) * rr * rr * x2;
  if (sign(z) * a2 * z2 > k) return sqrt(x2 + z2) * il2 - r2;

// id: 0 byxorna, 1 kavajens nedre del, 2 sitsen, 3 metallen, 4 skorna
float kropp(vec3 p, out int id) {
  // kavajen under fotot, ned till sitsen
  float kv = elli(p - vec3(-20., -700., 66.), vec3(336., 300., 236.));
  kv = max(kv, -(p.y + 918.));
  // Han sitter med sidan mot pulten: låren går ifrån den, knäna ut i rummet.
  vec3 hV = vec3(-190., -800., 40.), kV = vec3(-640., -930., 560.), aV = vec3(-700., -1640., 520.);
  vec3 hH = vec3(130., -800., 60.), kH = vec3(-400., -1010., 650.), aH = vec3(-370., -1780., 540.);

  float sko = min(elli(p - (aV + vec3(0., -60., 130.)), vec3(72., 56., 170.)), elli(p - (aH + vec3(0., -60., 130.)), vec3(72., 56., 170.)));

  float si = rulle(q, 322., 48., 40.);
  float me = rulle(q + vec3(0., 62., 0.), 330., 13., 6.);
  me = min(me, rulle(q + vec3(0., 650., 0.), 46., 590., 2.));
  me = min(me, rulle(q + vec3(0., 92., 0.), 120., 22., 8.));
  me = min(me, ring(q + vec3(0., 830., 0.), 290., 15.));
  me = min(me, rulle(q + vec3(0., 1280., 0.), 240., 10., 6.));
  float d = by; id = 0;
  if (kv < d) { d = kv; id = 1; }
  if (si < d) { d = si; id = 2; }
  if (me < d) { d = me; id = 3; }
  if (sko < d) { d = sko; id = 4; }
  return d;
}

void prova(int i, vec3 ro, vec3 rd, vec3 ird, inout Hit h) {
  vec4 d0 = data(i, 0), d1 = data(i, 1);
