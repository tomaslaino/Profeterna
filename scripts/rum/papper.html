<!doctype html><meta charset="utf-8"><canvas id="c" width="384" height="384"></canvas>
<script>
// Pappersstrukturen: fibrer, små fläckar och ojämn ton, som en ruta som kan läggas om och om igen.
// Allt ritas också runt kanterna, så att inga skarvar syns. Genomskinlig: den läggs över papperets färg.
const S = 384, c = document.getElementById('c'), g = c.getContext('2d');
let fro = 20261108;
const r = () => { fro = (fro + 0x6d2b79f5) | 0; let t = Math.imul(fro ^ (fro >>> 15), 1 | fro); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const u = (a, b) => a + r() * (b - a);
const runtom = (rita) => { for (const dx of [-S, 0, S]) for (const dy of [-S, 0, S]) { g.save(); g.translate(dx, dy); rita(); g.restore(); } };
// ojämn ton: stora mjuka moln, mörka och ljusa
for (let i = 0; i < 22; i++) {
  const x = u(0, S), y = u(0, S), R = u(44, 130), mork = r() < 0.55, a = u(0.006, 0.014);
  runtom(() => {
    const f = g.createRadialGradient(x, y, 0, x, y, R);
    f.addColorStop(0, mork ? `rgba(110,74,30,${a})` : `rgba(255,250,235,${a * 1.5})`);
    f.addColorStop(1, mork ? 'rgba(110,74,30,0)' : 'rgba(255,250,235,0)');
    g.fillStyle = f; g.beginPath(); g.arc(x, y, R, 0, 7); g.fill();
  });
}
// fibrer: korta böjda hår
for (let i = 0; i < 720; i++) {
  const x = u(0, S), y = u(0, S), l = u(4, 19), v = u(0, 6.3), b = u(-0.8, 0.8), mork = r() < 0.62;
  const x2 = x + Math.cos(v) * l, y2 = y + Math.sin(v) * l, cx = (x + x2) / 2 + Math.cos(v + 1.57) * b * l * 0.5, cy = (y + y2) / 2 + Math.sin(v + 1.57) * b * l * 0.5;
  const a = mork ? u(0.03, 0.08) : u(0.04, 0.12), w = u(0.5, 1.1);
  const nara = x < 30 || y < 30 || x > S - 30 || y > S - 30;
  const rita = () => { g.strokeStyle = mork ? `rgba(92,66,34,${a})` : `rgba(255,252,240,${a})`; g.lineWidth = w; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(cx, cy, x2, y2); g.stroke(); };
  if (nara) runtom(rita); else rita();
}
// små fläckar, som i återvunnet papper
for (let i = 0; i < 90; i++) {
  const x = u(0, S), y = u(0, S), R = r() < 0.9 ? u(0.35, 0.9) : u(0.9, 1.7), a = u(0.08, 0.26);
  g.fillStyle = `rgba(70,48,24,${a})`; g.beginPath(); g.ellipse(x, y, R, R * u(0.6, 1), u(0, 3), 0, 7); g.fill();
}
// färre nivåer i genomskinligheten: packas mycket bättre, och skillnaden syns inte
const d = g.getImageData(0, 0, S, S), p = d.data;
for (let i = 0; i < p.length; i += 4) {
  const a = Math.round(p[i + 3] / 5) * 5;
  p[i + 3] = a;
  // bara två färger: mörk fiber eller ljus fiber
  if (p[i] > 180) { p[i] = 255; p[i + 1] = 250; p[i + 2] = 236; } else { p[i] = 92; p[i + 1] = 66; p[i + 2] = 34; }
}
g.putImageData(d, 0, 0);
window.klar = true;
window.bild = (q) => c.toDataURL('image/webp', q);
</script>
