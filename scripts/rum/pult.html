<!doctype html><meta charset="utf-8"><body style="margin:0;background:#222"><canvas id="c"></canvas><script type="module">
// Pultens trä i tobaksaffären, bakat till public/rum/pult.webp, pult-mer.webp och pult-kant.webp
// (scripts/rum/pult.mjs). Samma pult som framför Hasse Backe i hans bild (rum-pult.js): samma trä (PULT_GLSL),
// som ådras längs pulten och, längst till vänster där den viker av mot en förbi honom, längs benet, med
// geringssnittet mellan dem; sett genom rummets kamera (RUM). Ringarna efter glas och metallisten längs den
// bortre kanten ritas ovanpå i rummet (table i rum.js), eftersom ringarna skiftar med dagen.
//
// Duken är scenens x −10…1610 (och till höger om bilden 1600…2140, hoger) och y 650…1340: pulten från den bortre kanten (y 650) och nedåt. Ovansidan går
// ned till y 1340 som om pulten fortsatte mot en (i telefonen på höjden står rummet längre bort och pult-mer.webp
// syns, utan framkant). Framkanten, där pulten slutar mot en vid y ≈ 984, är en egen remsa (kant): den tjocka,
// rundade kanten med samma trä.
import { PULT_GLSL, RUM, L, SKIVA } from '/rum-pult.js';
const X0 = -10, Y0 = 650, W = 1620, H = 690;
const KANT = { y: 940, h: 70 };
const c = document.getElementById('c');
const gl = c.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false });
const VS = `#version 300 es
in vec2 a; void main() { gl_Position = vec4(a, 0., 1.); }`;
const FS = `#version 300 es
precision highp float;
out vec4 ut;
uniform vec2 uRes; uniform vec2 uOrigo; uniform float uKant; uniform float uK;
${PULT_GLSL}
const float F = ${RUM.F.toFixed(2)}, CX = ${RUM.cx.toFixed(2)}, CY = ${RUM.cy.toFixed(2)}, KZ = ${RUM.Z.toFixed(2)}, KH = ${RUM.H.toFixed(2)}, KX = ${RUM.X.toFixed(2)};
const float Y = ${L.Y.toFixed(1)}, R1 = ${(SKIVA.RADIE * 0.75).toFixed(2)}, T = ${SKIVA.TJOCK.toFixed(1)}, R2 = ${(SKIVA.TJOCK - SKIVA.RADIE * 0.75 - 26).toFixed(2)};
// ljuset i rummet: lysröret och fönstren bakom gänget, högt och bortom pulten; ögat står vid pulten. Ljuset är
// lysrörets och dagens, svalare än barens lampor, så att pulten har samma dämpade bruna som framför Hasse Backe
// (inte orange) och är lite ljusare. Rummets egna lager ovanpå (rum-warm, vinjetten) är räknade med.
const vec3 LJ = normalize(vec3(.5, .86, -.1));
const vec3 FARG = vec3(1.41, 1.46, 1.67);
// ljuset faller av mot en (som pultens bild alltid har gjort, bakom gänget är det ljusast)
float fall(float sy) { float t = clamp((sy - 650.) / 690., 0., 1.); return mix(1., .36, pow(t, .8)); }
vec3 skugga(vec3 p, vec3 n, vec3 v, vec2 b, float sy) {
  vec3 tra = pultTra(b);
  float dif = .34 + .66 * max(0., dot(n, LJ));
  vec3 h = normalize(LJ + v);
  float sp = pow(max(0., dot(n, h)), 40.) * .05;
  return (tra * dif + vec3(1., .93, .84) * sp) * fall(sy) * FARG;
}
// en punkt i duken (scenens x, y) → färgen: strålen från ögat, mot ovansidan eller framkanten
vec3 punkt(vec2 s) {
  float k = (s.y - CY) / F;
  vec3 o = vec3(-KZ, Y + KH, KX);
  vec3 d = vec3(1., -k, (s.x - CX) / F);
  vec3 v = -normalize(d);
  float t = KH / k;
  vec3 p = o + d * t;
  if (uKant < .5 || p.x >= PULT_XI + R1) return skugga(p, vec3(0., 1., 0.), v, p.xz, s.y);
  // framkanten (barens x mot en): en kvartscirkel överst, en rak bit och en mindre rundning nedtill
  vec2 o2 = vec2(o.x, o.y), d2 = vec2(1., -k);
  vec2 cc = vec2(PULT_XI + R1, Y - R1);
  vec2 oc = o2 - cc;
  float bq = dot(oc, d2), cq = dot(oc, oc) - R1 * R1, aq = dot(d2, d2);
  float disk = bq * bq - aq * cq;
  if (disk > 0.) {
    float th = (-bq - sqrt(disk)) / aq;
    vec2 q = o2 + d2 * th;
    if (q.x <= cc.x && q.y >= cc.y) { vec3 n = vec3((q - cc) / R1, 0.); return skugga(vec3(q, o.z + d.z * th), n, v, vec2(q.x, o.z + d.z * th), s.y) * (.75 + .25 * n.y); }
  }
  // den raka biten
  float tf = PULT_XI - o.x;
  float yf = o.y - k * tf;
  if (yf <= Y - R1 && yf >= Y - T + R2) return skugga(vec3(PULT_XI, yf, o.z + d.z * tf), vec3(-1., 0., 0.), v, vec2(PULT_XI, o.z + d.z * tf), s.y) * .75;
  // nedre rundningen och under skivan: i skugga
  vec2 c2 = vec2(PULT_XI + R2, Y - T + R2);
  oc = o2 - c2; bq = dot(oc, d2); cq = dot(oc, oc) - R2 * R2; disk = bq * bq - aq * cq;
  if (disk > 0.) {
    float th = (-bq - sqrt(disk)) / aq;
    vec2 q = o2 + d2 * th;
    if (q.x <= c2.x && q.y <= c2.y) { vec2 n = (q - c2) / R2; return skugga(vec3(q, o.z + d.z * th), vec3(n, 0.), v, vec2(q.x, o.z + d.z * th), s.y) * (.5 + .25 * (1. + n.y)); }
  }
  // framsidan under skivan, indragen och i skugga
  return vec3(.11, .07, .045) * fall(s.y) * .5 * FARG;
}
void main() {
  vec2 px = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec3 sum = vec3(0.);
  // (16 strålar i varje bildpunkt: ådringen är finare än bildpunkterna längst bort)
  for (int i = 0; i < 4; i++) for (int j = 0; j < 4; j++) sum += punkt(uOrigo + (px + (vec2(i, j) + .5) / 4. - .5) / uK);
  ut = vec4(sum / 16., 1.);
}`;
const prog = (v, f) => { const p = gl.createProgram(); for (const [t, s] of [[gl.VERTEX_SHADER, v], [gl.FRAGMENT_SHADER, f]]) { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(o)); gl.attachShader(p, o); } gl.bindAttribLocation(p, 0, 'a'); gl.linkProgram(p); if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p)); return p; };
const p = prog(VS, FS);
gl.useProgram(p);
const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
// en bit av scenen (x0, y0, b, h) på duken, med eller utan framkanten → webp, med K bildpunkter på scenens
// (ådringen syns då också på skärmar med dubbel täthet)
const K = 2;
function rita(x0, y0, b, h, kant, q) {
  c.width = Math.round(b * K); c.height = Math.round(h * K);
  gl.viewport(0, 0, c.width, c.height);
  gl.uniform2f(gl.getUniformLocation(p, 'uRes'), c.width, c.height);
  gl.uniform2f(gl.getUniformLocation(p, 'uOrigo'), x0, y0);
  gl.uniform1f(gl.getUniformLocation(p, 'uK'), K);
  gl.uniform1f(gl.getUniformLocation(p, 'uKant'), kant ? 1 : 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.finish();
  return c.toDataURL('image/webp', q);
}
window.dela = (y, h, q) => rita(X0, Y0 + y, W, h, false, q);
window.kant = (q) => rita(X0, KANT.y, W, KANT.h, true, q);
// pulten till höger om bilden, där kameran går till videon (pultSvg i rum-video.js), med framkanten
window.hoger = (q) => rita(1599.5, 650, 541, 360, true, q);
window.KANT = KANT;
window.klar = true;
</script>
